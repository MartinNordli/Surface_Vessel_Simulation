# robot_localization settings for the sensor-based state estimate.
#
#   ekf_local   IMU only -> attitude in `odom`   (/njord/local/odometry)
#   ekf_global  GPS + IMU -> pose in `map`       (/njord/odometry)
#   navsat      GPS fix -> local ENU odometry     (/njord/gps/odometry)
#
# No ground truth enters these nodes. The navsat datum is not set here: the
# autonomy launch injects the world origin from njord_sim/constants.py so it
# always matches the Gazebo world.
#
# *_config vectors select measured states in robot_localization order:
#   [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    imu0: /sensors/imu/data
    # Orientation and angular rates from the IMU.
    imu0_config: [false, false, false, true, true, true, false, false, false, true, true, true, false, false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20
ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    imu0: /sensors/imu/data
    # Orientation and angular rates from the IMU.
    imu0_config: [false, false, false, true, true, true, false, false, false, true, true, true, false, false, false]
    odom0: /njord/gps/odometry
    # Position from the GPS (via navsat_transform).
    odom0_config: [true, true, true, false, false, false, false, false, false, false, false, false, false, false, false]
navsat:
  ros__parameters:
    frequency: 20.0
    delay: 0.5
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    broadcast_cartesian_transform: false
    publish_filtered_gps: false
    use_odometry_yaw: false
    use_local_cartesian: true
    wait_for_datum: true

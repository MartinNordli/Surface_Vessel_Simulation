# Reference autonomy tuning (ALGORITHMS_CONFIG), shared by every vessel unless
# vessel_overrides (at the end) replaces values for one vessel.
#
# This is the only place to tune the reference guidance, planner, mapper and
# setpoint controller in a
# simulator run: the values are validated at launch and take precedence over
# node defaults and ROS_PARAMS_FILE. Physical limits belong to the vessel file;
# values here may be lower but never exceed them. All units are SI.
schema_version: 5

# Speed ceiling (m/s) for each PROFILE (`PROFILE=fast ./scripts/njord demo`).
# Guidance further reduces speed for heading error, clearance and braking room.
speed_profiles_mps:
  fast: 2.0
  conservative: 1.0

guidance:
  lookahead_m: 8.0                  # line-of-sight target distance along the path
  kp_yaw: 400.0                     # N*m per rad of heading error
  kd_yaw: 300.0                     # N*m per rad/s of yaw rate (damping)
  kp_surge: 200.0                   # N per m/s of surge speed error
  max_thrust: 500.0                 # N per engine; must not exceed the vessel limit
  goal_tolerance_m: 1.5             # distance at which a waypoint counts as reached
  control_hz: 20.0                  # thrust command rate
  stale_after_s: 1.0                # path/odometry/map older than this stops the boat
  # Stopping model used to cap speed within the observed-free corridor. These
  # are assumptions until verified by dynamics measurements on the real boat.
  braking_deceleration_mps2: 0.25
  reaction_time_s: 1.0
  stopping_margin_m: 3.0

planner:
  stale_after_s: 1.0                # map/odometry older than this invalidates the path
  publish_hz: 5.0                   # path and status heartbeat rate

mapping:
  # Extra clearance added to the vessel's circumscribed radius when inflating
  # obstacles. For the WAM-V envelope (6 x 3.3 m) this gives exactly 4.0 m.
  safety_margin_m: 0.5761863368460016
  self_filter_margin_m: 0.02        # surface blind band, plus 3 x lidar stddev
  # Fixed occupancy grid in the map frame (ENU, origin at the world origin).
  # Every race course must lie inside it with room for approach and exit.
  grid_resolution_m: 0.5            # cell edge length
  grid_size_m: 160.0                # edge length of the square grid
  grid_origin_m: [-40.0, -40.0]     # map (x, y) of the grid's lower-left corner

mission:
  # Gate geometry of the reference mission (red buoy left, green right).
  min_gate_width_m: 8.0             # accepted buoy separation range
  max_gate_width_m: 30.0
  approach_m: 5.0                   # approach point before the gate centre
  exit_m: 6.0                       # exit point past the gate centre
  arrival_tolerance_m: 2.0          # distance at which a mission point counts as reached
  detection_max_age_s: 2.0          # oldest buoy sighting used outside the crossing zone
  crossing_memory_s: 45.0           # gate memory while crossing, when the buoys leave the cameras
  crossing_entry_m: 15.0            # crossing zone starts this far before the gate line
  # Search when no gate is in view: goals search_radius_m from where the
  # search began, at 0, +-40 and +-80 degrees from the course heading.
  search_after_s: 2.0               # time without a gate before searching
  search_radius_m: 8.0
  search_goal_s: 10.0               # longest time on one search goal; 5 goals fit in the timeout
  search_timeout_s: 60.0            # search time before reporting an error
  # Retry a gate passed outside its buoys: via a point beside the passed buoy.
  max_gate_retries: 1               # 0 disables retries
  retry_clearance_m: 6.0            # distance of that point outside the buoy; must exceed the
                                    # obstacle inflation (hull radius + safety_margin_m) + 1 m

# Reference controller of setpoint courses (scenarios with `setpoints:`), which
# drives to one target pose at a time from /njord/setpoint. Far from the target
# it turns towards it and limits surge speed (speed_profiles_mps) so it can stop
# with braking_deceleration_mps2; inside approach_radius_m it holds position and
# heading with PD control on the body-frame error. Only a fully actuated vessel
# (such as munin_v0) can push sideways; a two-thruster boat keeps pointing at the
# target until it is within align_radius_m and then turns to the target heading.
# Gains are starting values for a ~180 kg boat, not evidence of the real one.
setpoint_control:
  control_hz: 20.0                  # thrust command rate
  stale_after_s: 0.5                # odometry older than this stops the boat
  approach_radius_m: 5.0            # switch from transit to station keeping
  align_radius_m: 1.0               # two-thruster boat: turn to the target heading inside this
  kp_surge: 200.0                   # N per m/s of surge speed error (transit)
  kp_yaw: 400.0                     # N*m per rad of heading error
  kd_yaw: 300.0                     # N*m per rad/s of yaw rate
  kp_position: 100.0                # N per m of position error (station keeping)
  kd_position: 200.0                # N per m/s of body velocity (station keeping)
  braking_deceleration_mps2: 0.25   # assumed braking ability when approaching
  reaction_time_s: 1.0

navigation:
  stale_after_s: 0.5
  processing_margin_s: 0.1
  clock_stall_after_s: 0.5          # monotonic wall seconds
  sync_slop_s: 0.12                # maximum camera/lidar acquisition difference

# Per-vessel values that replace the shared ones above, keyed by the vessel's
# name ('wamv' for the WAM-V, otherwise `name` in the vessel file). Only the
# guidance, mapping, mission and setpoint_control sections, and only keys that
# exist above, may be
# overridden; the merged values pass the same checks. Values tuned against an
# uncalibrated vessel model are not evidence of the real boat.
vessel_overrides: {}


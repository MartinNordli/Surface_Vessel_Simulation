name: CPU correctness
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pyyaml opencv-python-headless
      - run: python tests/test_dstar_lite.py
      - run: python -m unittest discover -s tests -p 'test_*.py'

name: njord-sim
x-common: &common
  image: ${NJORD_IMAGE:-njord-sim:local}
  build: .
  init: true
  user: ${NJORD_UID:-1000}:${NJORD_GID:-1000}
  network_mode: host
  ipc: host
  pid: host
  environment: &environment
    HOME: /tmp/njord-home
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    SCENARIO: ${SCENARIO:-/opt/njord/scenarios/reference.yaml}
    SEED: ${SEED:-1}
    GZ_PARTITION: ${GZ_PARTITION:-njord-sim}
    ENVIRONMENT: ${ENVIRONMENT:-calm}
    PROFILE: ${PROFILE:-fast}
    RUN_LABEL: ${RUN_LABEL:-demo}
    RUN_ID: ${RUN_ID:-}
    AUTONOMY: ${AUTONOMY:-reference}
    CONTROLLER: ${CONTROLLER:-reference}
    PERCEPTION: ${PERCEPTION:-reference}
    MAPPING: ${MAPPING:-reference}
    VESSEL_CONFIG: ${VESSEL_CONFIG:-/opt/njord/install/share/njord_sim/config/vessel.yaml}
    ROS_PARAMS_FILE: ${ROS_PARAMS_FILE:-}
    OUTPUT_DIR: /outputs
    RUNNER_GIT_COMMIT: ${RUNNER_GIT_COMMIT:-unknown}
    IMAGE_ID: ${IMAGE_ID:-unknown}
  volumes:
    - ${OUTPUT_HOST:-./outputs/demo}:/outputs
    - ${CONFIG_HOST:-./njord_sim/config}:/config:ro
  stop_grace_period: 10s
services:
  simulator:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [ros2, launch, njord_sim, simulation.launch.py]
  autonomy:
    <<: *common
    command: [python3, /opt/njord/scripts/run_autonomy.py]
  evaluator:
    <<: *common
    command: [python3, /opt/njord/scripts/run_evaluator.py]
  tests:
    <<: *common
    profiles: [test]
    command: [bash, -c, "python3 tests/test_dstar_lite.py && python3 -m unittest discover -s tests -p 'test_*.py'"]
  rviz:
    <<: *common
    profiles: [gui]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      <<: *environment
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/xauthority:ro
    command: [rviz2, -d, /opt/njord/install/share/njord_sim/config/njord.rviz, --ros-args, -p, use_sim_time:=true]
